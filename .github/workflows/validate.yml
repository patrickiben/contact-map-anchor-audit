name: Validate toolkit and browser lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install Python reference toolkit
        run: python -m pip install .
      - name: Check Python numerics and input contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check educational content and adverse fixtures
        run: python scripts/build_education.py --check --self-test
      - name: Check the generated standalone lab
        run: python scripts/build_standalone.py --check
      - name: Install browser test dependencies
        run: npm ci
      - name: Check JavaScript numerical core
        run: npm run test:core
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser behavior and accessibility
        run: npm test
