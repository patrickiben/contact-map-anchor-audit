[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-map-anchor-audit"
version = "0.2.2"
description = "Inspect how a declared diagram translation changes persistence comparisons and rankings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Patrick Iben"}]
dependencies = []

# The pinned optional stack requires Python >=3.12 and compatible platform wheels.
[project.optional-dependencies]
fast = ["gudhi==3.13.0", "numpy==2.5.3", "scipy==1.18.1"]

[project.scripts]
anchor-audit = "anchor_audit.__main__:main"

[tool.setuptools]
packages = ["anchor_audit"]
